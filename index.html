<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت وی‌اسکیپ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #f59e0b; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        <!-- هدر -->
        <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-lg text-center">
            <h1 class="text-2xl font-bold">مدیریت پرسنل وی‌اسکیپ</h1>
        </div>

        <script>
            // لینک وب‌اپلیکیشن گوگل اسکریپت شما
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9ohiXTURucDhcGuIyVySWdzR9jXxn_I7CbDEuQt0EjvRxGUUj02qBk5sK1xGTCCt0/exec';
        </script>

        <!-- فرم ثبت اطلاعات -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-1">انتخاب ماه</label>
                    <select id="month" onchange="loadEmployees()" class="w-full border p-2 rounded-lg bg-slate-50">
                        <option value="فروردین">فروردین</option><option value="اردیبهشت">اردیبهشت</option><option value="خرداد">خرداد</option>
                        <option value="تیر">تیر</option><option value="مرداد">مرداد</option><option value="شهریور" selected>شهریور</option>
                        <option value="مهر">مهر</option><option value="آبان">آبان</option><option value="آذر">آذر</option>
                        <option value="دی">دی</option><option value="بهمن">بهمن</option><option value="اسفند">اسفند</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">انتخاب کارمند</label>
                    <select id="employee" class="w-full border p-2 rounded-lg bg-slate-50">
                        <option>در حال بارگذاری...</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t pt-4">
                <div>
                    <label class="block text-sm font-bold mb-1">روز (عدد ۱ تا ۳۱)</label>
                    <input type="number" id="day" placeholder="مثلاً ۵" class="w-full border p-2 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">سانس 23:00</label>
                    <select id="v23" class="w-full border p-2 rounded-lg bg-slate-50">
                        <option value="">تغییر نده</option><option value="حضور">حضور</option><option value="عدم حضور">عدم حضور</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">سانس 01:15</label>
                    <select id="v01" class="w-full border p-2 rounded-lg bg-slate-50">
                        <option value="">تغییر نده</option><option value="حضور">حضور</option><option value="عدم حضور">عدم حضور</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 border-t pt-4">
                <div>
                    <label class="block text-sm font-bold mb-1">مبلغ مساعده ۱ (تومان)</label>
                    <input type="number" id="m1" class="w-full border p-2 rounded-lg" placeholder="۰">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">دلیل مساعده ۱</label>
                    <input type="text" id="d1" class="w-full border p-2 rounded-lg" placeholder="...">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">مبلغ مساعده ۲ (تومان)</label>
                    <input type="number" id="m2" class="w-full border p-2 rounded-lg" placeholder="۰">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">دلیل مساعده ۲</label>
                    <input type="text" id="d2" class="w-full border p-2 rounded-lg" placeholder="...">
                </div>
            </div>

            <div class="flex items-center gap-4 border-t pt-4">
                <button onclick="submitData()" class="bg-amber-500 hover:bg-amber-600 text-white px-6 py-2 rounded-lg font-bold">ثبت در گوگل شیت</button>
                <div id="loaderSubmit" class="loader"></div>
                <p id="msgSubmit" class="text-sm font-bold text-emerald-600"></p>
            </div>
        </div>

        <!-- بخش گزارش‌گیری -->
        <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-sm space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">گزارش‌گیری ماهانه</h2>
                <div class="flex items-center gap-2">
                    <div id="loaderReport" class="loader" style="border-top-color: white;"></div>
                    <button onclick="getReport()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold">دریافت گزارش</button>
                </div>
            </div>
            
            <div id="reportBox" class="hidden bg-slate-800 p-4 rounded-xl space-y-4">
                <div>
                    <h3 class="text-amber-400 font-bold border-b border-slate-700 pb-1 mb-2">گزارش VIPها (جمع: <span id="rTotalVip">0</span> سانس)</h3>
                    <ul id="rVipList" class="text-sm space-y-1 list-disc pl-5 rtl:pr-5 text-slate-300"></ul>
                </div>
                <div>
                    <h3 class="text-amber-400 font-bold border-b border-slate-700 pb-1 mb-2">گزارش مساعده‌ها (جمع: <span id="rTotalAdv">0</span> تومان)</h3>
                    <ul id="rAdvList" class="text-sm space-y-1 list-disc pl-5 rtl:pr-5 text-slate-300"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // بارگذاری لیست کارمندان هنگام لود صفحه
        window.onload = loadEmployees;

        function loadEmployees() {
            const month = document.getElementById('month').value;
            fetch(`${SCRIPT_URL}?action=getEmployees&month=${month}`)
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('employee');
                    select.innerHTML = '';
                    if(data.employees && data.employees.length > 0) {
                        data.employees.forEach(emp => {
                            select.innerHTML += `<option value="${emp}">${emp}</option>`;
                        });
                    } else {
                        select.innerHTML = '<option>کارمندی یافت نشد</option>';
                    }
                })
                .catch(err => {
                    document.getElementById('employee').innerHTML = '<option>خطا در اتصال</option>';
                });
        }

        function submitData() {
            const day = document.getElementById('day').value;
            if(!day) return alert("لطفاً روز را وارد کنید");
            
            document.getElementById('loaderSubmit').style.display = 'block';
            document.getElementById('msgSubmit').innerText = '';

            const payload = {
                month: document.getElementById('month').value,
                date: day + ' ' + document.getElementById('month').value,
                employee: document.getElementById('employee').value,
                v23: document.getElementById('v23').value,
                v01: document.getElementById('v01').value,
                m1: document.getElementById('m1').value,
                d1: document.getElementById('d1').value,
                m2: document.getElementById('m2').value,
                d2: document.getElementById('d2').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            }).then(res => res.json()).then(res => {
                document.getElementById('loaderSubmit').style.display = 'none';
                if(res.success) {
                    document.getElementById('msgSubmit').innerText = "اطلاعات با موفقیت ثبت شد!";
                    // پاک کردن فرم پس از ثبت
                    document.getElementById('day').value = '';
                    document.getElementById('v23').value = ''; document.getElementById('v01').value = '';
                    document.getElementById('m1').value = ''; document.getElementById('d1').value = '';
                    document.getElementById('m2').value = ''; document.getElementById('d2').value = '';
                    setTimeout(()=> document.getElementById('msgSubmit').innerText = '', 3000);
                } else {
                    alert("خطا در ثبت: " + res.error);
                }
            }).catch(err => {
                document.getElementById('loaderSubmit').style.display = 'none';
                alert("ارتباط برقرار نشد. لطفاً اینترنت را بررسی کنید.");
            });
        }

        function getReport() {
            document.getElementById('loaderReport').style.display = 'block';
            const month = document.getElementById('month').value;
            const emp = document.getElementById('employee').value;

            fetch(`${SCRIPT_URL}?action=getReport&month=${month}&employee=${emp}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loaderReport').style.display = 'none';
                    document.getElementById('reportBox').classList.remove('hidden');
                    
                    document.getElementById('rTotalVip').innerText = data.totalVips || 0;
                    document.getElementById('rTotalAdv').innerText = (data.totalAdvance || 0).toLocaleString();

                    let vipHtml = '';
                    if(data.vips && data.vips.length > 0) {
                        data.vips.forEach(v => {
                            let text = v.date + " : ";
                            if(v.v23) text += "سانس ۲۳:۰۰ ";
                            if(v.v01) text += (v.v23 ? "و " : "") + "سانس ۰۱:۱۵";
                            vipHtml += `<li>${text}</li>`;
                        });
                    } else {
                        vipHtml = '<li>موردی ثبت نشده است</li>';
                    }
                    document.getElementById('rVipList').innerHTML = vipHtml;

                    let advHtml = '';
                    if(data.advances && data.advances.length > 0) {
                        data.advances.forEach(a => {
                            if(a.m1 > 0) advHtml += `<li>${a.date} : مبلغ ${a.m1.toLocaleString()} تومان (${a.d1})</li>`;
                            if(a.m2 > 0) advHtml += `<li>${a.date} : مبلغ ${a.m2.toLocaleString()} تومان (${a.d2})</li>`;
                        });
                    } else {
                        advHtml = '<li>موردی ثبت نشده است</li>';
                    }
                    document.getElementById('rAdvList').innerHTML = advHtml;
                })
                .catch(err => {
                    document.getElementById('loaderReport').style.display = 'none';
                    alert("خطا در دریافت گزارش.");
                });
        }
    </script>
</body>
</html>
